name: Build with make

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  make-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            liblog4cpp5-dev \
            libhiredis-dev \
            libjsoncpp-dev

      - name: Prepare third-party dependencies
        # 源码里写死了 #include "/home/wuyijian/simhash/..."，
        # 因此搭好该路径并 clone 与源码匹配的旧版 simhash(v0.9.5，src/CppJieba 已内嵌)。
        # 兼容 "json/json.h" + -ljson(jsoncpp)
        run: |
          sudo mkdir -p /home/wuyijian
          git clone --depth 1 --branch v0.9.5 \
            https://github.com/yanyiwu/simhash.git "$GITHUB_WORKSPACE/third_party/simhash"
          sudo ln -sfn "$GITHUB_WORKSPACE/third_party/simhash" /home/wuyijian/simhash
          # jsoncpp 头文件补成 "json/json.h" 的查找方式
          sudo ln -sfn /usr/include/jsoncpp/json /usr/include/json
          # 提供 -ljson 兼容链接名
          sudo ln -sfn /usr/lib/x86_64-linux-gnu/libjsoncpp.so /usr/local/lib/libjson.so
          sudo ldconfig

      - name: Build
        run: |
          mkdir -p bin
          make

      - name: Verify binary
        run: file bin/main && ls -l bin/main
